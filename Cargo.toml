[workspace]
# Members are listed explicitly: a glob such as "crates/*" fails while it matches nothing.
members = [
    "crates/mic-admit",
    "crates/mic-core",
    "crates/mic-crowd",
    "crates/mic-harness",
    "crates/mic-media",
    "crates/mic-render",
    "crates/mic-slint",
    "crates/mic-testrelay",
    "testbox/camera",
    "testbox/forger",
    "testbox/probe",
    "xtask",
]
resolver = "3"
# Spikes are measurements, not part of the app (PLAN.md, M4).
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# What the box runs (`cargo testbox build`): optimized, as media code will need, but incremental
# and without LTO, so a change is in the box in seconds; line tables for backtraces.
[profile.testbox]
inherits = "release"
incremental = true
codegen-units = 256
debug = "line-tables-only"

# moq-video with two changes not yet upstream (a capture that asks the portal every time; a capture
# that ends when the compositor stops sharing, without a crash), on a fork: every moq crate comes
# from that one commit, the 0.1.16 release plus the two, so they stay one copy each. Drop once
# moq-dev/moq releases them. The commit is barafael/moq's ceda4e39 (branch mic-portal-ask) with its
# .claude/shared submodule dropped: cargo fetches a git dependency's submodules, and that one's
# repository, kixelated/skills, was emptied, so every build failed. Upstream has the second change
# since (#6939), not yet the first.
[patch.crates-io]
hang = { git = "https://github.com/felintusun/moq", rev = "c1c9a87b6d5e4e5bb44362eb72c61c27b5cdf416" }
kio = { git = "https://github.com/felintusun/moq", rev = "c1c9a87b6d5e4e5bb44362eb72c61c27b5cdf416" }
moq-audio = { git = "https://github.com/felintusun/moq", rev = "c1c9a87b6d5e4e5bb44362eb72c61c27b5cdf416" }
moq-auth = { git = "https://github.com/felintusun/moq", rev = "c1c9a87b6d5e4e5bb44362eb72c61c27b5cdf416" }
moq-binary = { git = "https://github.com/felintusun/moq", rev = "c1c9a87b6d5e4e5bb44362eb72c61c27b5cdf416" }
moq-e2ee = { git = "https://github.com/felintusun/moq", rev = "c1c9a87b6d5e4e5bb44362eb72c61c27b5cdf416" }
moq-flate = { git = "https://github.com/felintusun/moq", rev = "c1c9a87b6d5e4e5bb44362eb72c61c27b5cdf416" }
moq-json = { git = "https://github.com/felintusun/moq", rev = "c1c9a87b6d5e4e5bb44362eb72c61c27b5cdf416" }
